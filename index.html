              return target ? target.apply(window, arguments) : Promise.reject(new Error('fetch not available'));
            };

            // Ensure Window.prototype.fetch has a setter if it is read-only

                    get: function() { return _safeFetch; },

            // Ensure window.fetch has a setter so libraries assigning window.fetch do not throw
            try {
              var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
              if (!winDesc || !winDesc.writable || !winDesc.set) {
                Object.defineProperty(window, 'fetch', {
                  get: function() { return _safeFetch; },
                  set: function(fn) { _safeFetch = fn; },
                  configurable: true,
